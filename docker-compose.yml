# Runs the kit's engine, the open-source Google Maps scraper (gosom/google-maps-scraper), locally.
# Serves the web UI and API on http://localhost:8080. Host port: SCRAPER_PORT in .env, default 8080.
# The image has no built-in auth, so the port is bound to 127.0.0.1 only. That localhost binding is
# the security boundary. Do not change the mapping to 0.0.0.0 or a public interface without an auth
# proxy in front.

services:
  google-maps-scraper:
    # Engine image, pinned to a known-good release so runs are reproducible. Bump it deliberately.
    # Bumped from v1.15.0 on 2026-09-23: that build's embedded Playwright driver (1.57.0)
    # returns 404 from Microsoft's CDN, which purges old driver builds. v1.18.1 ships a driver
    # version that is still hosted.
    # v1.18.1 publishes both amd64 and arm64, so Apple Silicon (M1/M2/M3) runs it natively.
    # Only older tags are amd64 and need the 'platform' line below. Default: commented out.
    image: gosom/google-maps-scraper:v1.18.1
    # platform: linux/amd64
    container_name: gmaps-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    ports:
      # Host port comes from SCRAPER_PORT in .env (default 8080). The container side stays 8080.
      - "127.0.0.1:${SCRAPER_PORT:-8080}:8080"   # localhost only, see the warning above
    volumes:
      - gmaps_data:/gmapsdata    # job results; they persist until you delete the job or the volume
      - gmaps_cache:/opt         # Playwright browser cache, so restarts skip the download

volumes:
  gmaps_data:
  gmaps_cache:
