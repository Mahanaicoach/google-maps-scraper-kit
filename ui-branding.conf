# Fronts the engine's web UI so its "Star on GitHub" button and sponsor box point at this kit
# instead of upstream. The engine embeds its HTML in the binary, so the links are rewritten in
# flight. sub_filter only touches text/html: API JSON and CSV downloads pass through unchanged.
server {
    listen 8080;

    # Docker's DNS, re-resolved so a recreated engine container is still found.
    resolver 127.0.0.11 valid=10s;
    set $engine http://google-maps-scraper:8080;

    location / {
        proxy_pass $engine;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";   # sub_filter cannot rewrite a gzipped body

        sub_filter_once off;
        sub_filter 'github.com/gosom/google-maps-scraper' 'github.com/Mahanaicoach/google-maps-scraper-kit';
        sub_filter 'github.com/sponsors/gosom' 'github.com/sponsors/Mahanaicoach';
        sub_filter 'Sponsor on GitHub' 'Become a sponsor';
        # Same sponsors, order and links as the README's "Sponsored by" section.
        sub_filter '<p class="sponsor-text">Support the ongoing maintenance and development of this project by becoming a sponsor. Your contribution helps ensure the tool\'s continued improvement and reliability.</p>'
                   '<p class="sponsor-text">Sponsored by <a href="https://www.swiftproxy.net/?ref=googlemapsscraperkit" target="_blank" rel="sponsored noopener"><strong>Swiftproxy</strong></a>, residential proxies for Google Maps scraping (10% off with code <strong>PROXY90</strong>), and <a href="https://serpapi.com/maps-scraper-kit-github" target="_blank" rel="sponsored noopener"><strong>SerpApi</strong></a>, the Google Maps API in JSON and Markdown.</p>';
    }
}
